[project]
name = "retail-smart-ops-api"
version = "0.1.0"
description = "C2C-000 minimal API bootstrap"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.156.4",
    "pydantic==2.14.1",
    "SQLAlchemy==2.0.45",
    "alembic==1.18.4",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.12"]
search-vector = [
    "numpy==2.2.6",
    "onnxruntime==1.22.1",
    "tokenizers==0.22.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
pythonpath = ["."]
